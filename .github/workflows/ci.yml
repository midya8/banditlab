name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m banditlab demo > /tmp/demo.json
      - run: python -m banditlab solve examples/two-arms.json > /tmp/solve.json
      - run: PYTHONPATH=. python examples/render_audit.py --check
      - run: python -m banditlab policy-demo > /tmp/policy-demo.json
      - run: python -m banditlab audit examples/policy.json > /tmp/policy.json
      - run: PYTHONPATH=. python examples/render_policy_audit.py --check
