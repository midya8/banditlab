<text x="30" y="777" font-size="16" style="fill:#e7edf8">Gap = optimal state value minus chosen-action optimal-continuation Q. Summed gaps equal policy loss.</text>
<text x="30" y="805" font-size="16" style="fill:#b7c4d9">Occupancy sums history probabilities, not history counts. Not empirical trials or a causal / frequentist guarantee.</text>
