<text x="620" y="553" font-size="17" style="fill:#e9bb79">Greedy loss: 1/36 + 0 + 0 = 1/36.</text>
<text x="620" y="580" font-size="17" style="fill:#e7edf8">Fixed loss: 1/36 + 8/297 + 1/99 = 7/108.</text>
